<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: header-nav}"></div>

    <div class="container mt-2">
	    <h2>Edit User</h2>
	
	    <form action="#" th:action="@{/courseapp/user/save}" th:object="${user}"
	          method="POST">
	
	        <!-- Add hidden form field to handle update -->
	        <input type="hidden" th:field="*{id}" />
			<div class="form-group">
				<label for="firstName">First Name</label>
				<input type="text" th:field="*{firstName}" class="form-control mb-4 col-4" placeholder="First Name" >
			</div>
			<div class="form-group">
				<label for="lastName">Last Name</label>
				<input type="text" th:field="*{lastName}" class="form-control mb-4 col-4" placeholder="Last Name" >
			</div>
			<div class="form-group">
				<label for="userName">User Name</label>
				<input type="text" th:field="*{userName}" class="form-control mb-4 col-4" placeholder="User Id" >
			</div>
			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" th:field="*{password}" class="form-control mb-4 col-4" placeholder="Password" >
			</div>
			<div class="form-group">
				<label for="email">Email</label>
				<input type="text" th:field="*{email}" class="form-control mb-4 col-4" placeholder="Email" >
			</div>
			<div class="form-group">
				<label for="role">Role</label>
				<input type="text" th:field="*{role}" class="form-control mb-4 col-4" placeholder="Role">
			</div>
	        <button type="submit" class="btn btn-info col-2">Save User</button>
	    </form>
	
	    <hr>
	
	    <a th:href = "@{/courseapp/courses}"> Back to Users List</a>
	</div>

	<div th:replace="~{fragments/footer :: footer-section}"></div>
</body>
</html>
