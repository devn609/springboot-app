<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: header-nav}"></div>

    <div class="container mt-2">

	  <h1>Courses</h1>
	
	  <a th:href = "@{/courseapp/course/new}" class="btn btn-primary btn-sm mb-3"> Add </a>
	
	  <table border="1" class = "table table-striped table-responsive-md">
	    <thead>
	    <tr>
		  <th>
		    <a th:href="@{'/courseapp/courses/page/' + ${currentPage} + '?sortField=title&sortOrder=' + ${reverseSortOrder}}">
		      Course Title</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/courses/page/' + ${currentPage} + '?sortField=description&sortOrder=' + ${reverseSortOrder}}">
		      Description</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/courses/page/' + ${currentPage} + '?sortField=startDate&sortOrder=' + ${reverseSortOrder}}">
		      Start</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/courses/page/' + ${currentPage} + '?sortField=endDate&sortOrder=' + ${reverseSortOrder}}">
		      End</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/courses/page/' + ${currentPage} + '?sortField=createdAt&sortOrder=' + ${reverseSortOrder}}">
		      Created On</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/courses/page/' + ${currentPage} + '?sortField=updatedAt&sortOrder=' + ${reverseSortOrder}}">
		      Updated On</a>
		  </th>
	
	
	      <th> Actions </th>
	    </tr>
	    </thead>
	    <tbody>
	    <tr th:each="course : ${listCourses}">
		  <td th:text="${course.title}"></td>
		  <td th:text="${course.description}"></td>
		  <td th:text="${course.startDate}"></td>
		  <td th:text="${course.endDate}"></td>
		  <td th:text="${course.createdAt}"></td>
		  <td th:text="${course.updatedAt}"></td>
	      <td> 
			<NOBR>
			<a th:href="@{/courseapp/course/edit/{id}(id=${course.id})}" class="btn btn-primary btn-sm"><i class="bi-pencil"></i>Edit</a>
	        <a th:href="@{/courseapp/course/delete/{id}(id=${course.id})}" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i>Delete</a>
			</NOBR>
	      </td>
	    </tr>
	    </tbody>
	  </table>
	
	  <div th:if = "${totalPages > 1}">
	    <div class = "row col-sm-10">
	      <div class = "col-sm-5">
	        Total Rows: [[${totalItems}]]
	      </div>
	      <div class = "col-sm-3">
	        <span th:each="i: ${#numbers.sequence(1, totalPages)}">
	            <a th:if="${currentPage != i}" th:href="@{'/courseapp/courses/page/' + ${i}+ '?sortField=' + ${sortField} + '&sortOrder=' + ${sortOrder}}">[[${i}]]</a>
	            <span th:unless="${currentPage != i}">[[${i}]]</span>  &nbsp; &nbsp;
	        </span>
	      </div>
	      <div class = "col-sm-1">
	        <a th:if="${currentPage < totalPages}" th:href="@{'/courseapp/courses/page/' + ${currentPage + 1}+ '?sortField=' + ${sortField} + '&sortOrder=' + ${sortOrder}}">Next</a>
	        <span th:unless="${currentPage < totalPages}">Next</span>
	      </div>
	
	      <div class="col-sm-1">
	        <a th:if="${currentPage < totalPages}" th:href="@{'/courseapp/courses/page/' + ${totalPages}+ '?sortField=' + ${sortField} + '&sortOrder=' + ${sortOrder}}">Last</a>
	        <span th:unless="${currentPage < totalPages}">Last</span>
	      </div>
	    </div>
	  </div>
	</div>
	<div th:replace="~{fragments/footer :: footer-section}"></div>
</body>
</html>
