<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: header-nav}"></div>

    <div class="container mt-2">
	    <h2>Edit Course</h2>
	
	    <form action="#" th:action="@{/courseapp/course/save}" th:object="${course}"
	          method="POST">
	
	        <!-- Add hidden form field to handle update -->
	        <input type="hidden" th:field="*{id}" />
			<div class="form-group">
				<label for="title">Title</label>
				<input type="text" th:field="*{title}" class="form-control mb-4 col-4" placeholder="Course Title" >
			</div>
			<div class="form-group">
				<label for="description">Description</label>
				<input type="text" th:field="*{description}" class="form-control mb-4 col-4" placeholder="Description" >
			</div>
			<div class="form-group">
				<label for="startDate">Start Date</label>
				<input type="date" th:field="*{startDate}" class="form-control mb-4 col-4" placeholder="Start Date">
			</div>
			<div class="form-group">
				<label for="endDate">End Date</label>
				<input type="date" th:field="*{endDate}" class="form-control mb-4 col-4" placeholder="End Date">
			</div>
			
	        <button type="submit" class="btn btn-info col-2">Save Course</button>
	    </form>
	
	    <hr>
	
	    <a th:href = "@{/courseapp/courses}"> Back to Course List</a>
	</div>
	<div th:replace="~{fragments/footer :: footer-section}"></div>
</body>
</html>
