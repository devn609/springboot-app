<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: header-nav}"></div>

    <div class="container mt-2">
		
	  <h1>Users</h1>
	
	  <a th:href = "@{/courseapp/user/new}" class="btn btn-primary btn-sm mb-3"> Add </a>
	  
	
	  <table border="1" class = "table table-striped table-responsive-md">
	    <thead>
	    <tr>
		  <th>
		    <a th:href="@{'/courseapp/users/page/' + ${currentPage} + '?sortField=firstName&sortOrder=' + ${reverseSortOrder}}">
		      First Name</a>
		  </th>
		  <th>
		    <a th:href="@{'/coursedemo/users/page/' + ${currentPage} + '?sortField=lastName&sortOrder=' + ${reverseSortOrder}}">
		      Last Name</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/users/page/' + ${currentPage} + '?sortField=email&sortOrder=' + ${reverseSortOrder}}">
		      Email</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/users/page/' + ${currentPage} + '?sortField=userName&sortOrder=' + ${reverseSortOrder}}">
		      User Name</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/users/page/' + ${currentPage} + '?sortField=role&sortOrder=' + ${reverseSortOrder}}">
		      Role</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/users/page/' + ${currentPage} + '?sortField=createdAt&sortOrder=' + ${reverseSortOrder}}">
		      Created On</a>
		  </th>
		  <th>
		    <a th:href="@{'/courseapp/users/page/' + ${currentPage} + '?sortField=updatedAt&sortOrder=' + ${reverseSortOrder}}">
		      Updated On</a>
		  </th>
	      <th> Actions </th>
	    </tr>
	    </thead>
	    <tbody>
	    <tr th:each="user : ${listUsers}">
		  <td th:text="${user.firstName}"></td>
		  <td th:text="${user.lastName}"></td>
		  <td th:text="${user.email}"></td>
		  <td th:text="${user.userName}"></td>
		  <td th:text="${user.role}"></td>
		  <td th:text="${user.createdAt}"></td>
		  <td th:text="${user.updatedAt}"></td>	  
	      <td>
			<NOBR> 
			<a th:href="@{/courseapp/user/edit/{id}(id=${user.id})}" class="btn btn-primary btn-sm">Edit</a>
	        <a th:href="@{/courseapp/user/delete/{id}(id=${user.id})}" class="btn btn-danger btn-sm">Delete</a>
			</NOBR>
	      </td>
	    </tr>
	    </tbody>
	  </table>
	
	  <div th:if = "${totalPages > 1}">
	    <div class = "row col-sm-10">
	      <div class = "col-sm-5">
	        Total Rows: [[${totalItems}]]
	      </div>
	      <div class = "col-sm-3">
	        <span th:each="i: ${#numbers.sequence(1, totalPages)}">
	            <a th:if="${currentPage != i}" th:href="@{'/courseapp/users/page/' + ${i}+ '?sortField=' + ${sortField} + '&sortOrder=' + ${sortOrder}}">[[${i}]]</a>
	            <span th:unless="${currentPage != i}">[[${i}]]</span>  &nbsp; &nbsp;
	        </span>
	      </div>
	      <div class = "col-sm-1">
	        <a th:if="${currentPage < totalPages}" th:href="@{'/courseapp/users/page/' + ${currentPage + 1}+ '?sortField=' + ${sortField} + '&sortOrder=' + ${sortOrder}}">Next</a>
	        <span th:unless="${currentPage < totalPages}">Next</span>
	      </div>
	
	      <div class="col-sm-1">
	        <a th:if="${currentPage < totalPages}" th:href="@{'/courseapp/users/page/' + ${totalPages}+ '?sortField=' + ${sortField} + '&sortOrder=' + ${sortOrder}}">Last</a>
	        <span th:unless="${currentPage < totalPages}">Last</span>
	      </div>
	    </div>
	  </div>
	</div>
	
	<div th:replace="~{fragments/footer :: footer-section}"></div>
</body>
</html>
