<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: header-nav}"></div>

    <div class="container mt-2">

	    <h2>Edit Assignment</h2>
	
	    <form action="#" th:action="@{/courseapp/assignment/save}" th:object="${assignment}"
	          method="POST">
	
	        <!-- Add hidden form field to handle update -->
	        <input type="hidden" th:field="*{id}" />
	
				<div class="form-group">
			      <label for="course">Course</label>
			      <select id="course" th:field="*{course}" class="form-control" style="width: 200px;">
			          <option th:each="course : ${listCourses}" 
			                  th:value="${course.id}" 
			                  th:text="${course.title}"></option>
			      </select>
			   	</div>
			   	<div class="form-group">
			      	<label for="title">Title</label>
			   		<input type="text" th:field="*{title}" class="form-control mb-4 col-4" placeholder="Title" >
			   	</div>
			   	<div class="form-group">
			       	<label for="description">Description</label>
			    	<input type="text" th:field="*{description}" class="form-control mb-4 col-4" placeholder="Description" >
			   	</div>
			   	<div class="form-group">
			       	<label for="dueDate">Due Date</label>
					<input type="date" th:field="*{dueDate}" class="form-control mb-4 col-4" placeholder="Due Date">
				</div>
			 
	        <button type="submit" class="btn btn-info col-2">Save Assignment</button>
	    </form>
	
	    <hr>
	
	    <a th:href = "@{/courseapp/assignments}"> Back to Assignment List</a>
	</div>
	
	<div th:replace="~{fragments/footer :: footer-section}"></div>
</body>
</html>
